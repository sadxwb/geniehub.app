name: geniehub_core
description: "GenieHub shared foundation - theme, models, database, bridge interfaces"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.32.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_riverpod: ^3.2.1
  uuid: ^4.5.3
  intl: ^0.20.2
  google_mobile_ads: ^7.0.0
  flutter_dotenv: ^5.2.1
  talker: ^5.1.14
  talker_flutter: ^5.1.14
  talker_riverpod_logger: ^5.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
